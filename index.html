<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CE Performance Tracker V4</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head><body>
<aside><h2>CE Performance</h2>
<button data-page="dashboard">Dashboard</button><button data-page="ranking">Top Ranking</button>
<button data-page="weekly">Weekly Tracking</button><button data-page="monthly">Monthly Summary</button>
<button data-page="employees">All Employees</button><button data-page="teams">Teams</button><button data-page="rules">Performance Rules</button>
<button id="uploadBtn">Upload Weekly Excel</button></aside>
<main><header><div><h1 id="title">Dashboard</h1><p id="sub">Weekly and monthly Customer Engineer performance tracking</p></div>
<div class="actions"><button id="printBtn">Print / PDF</button><button id="excelBtn">Export Excel</button></div></header>
<div class="filters"><select id="teamFilter"></select><select id="monthFilter"></select><select id="weekFilter"></select>
<input id="search" placeholder="Search CE Name or CE Code"><button id="clear">Clear</button></div><div id="app"></div></main>
<div id="modal"><div class="modalbox"><button id="close">×</button><h2>Upload Weekly Excel</h2>
<p>Upload one weekly Excel file. The system uses the date column to separate records into weeks and months.</p>
<input type="file" id="file" accept=".xlsx,.xls,.csv"><p id="msg"></p></div></div>
<script src="app.js"></script></body></html>
